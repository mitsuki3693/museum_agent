name: Publish MUSE static demo
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: web
      - run: npm run build:pages
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: /museum_agent
          NEXT_PUBLIC_MUSE_AI_URL: ${{ vars.MUSE_PUBLIC_AI_URL }}
      - run: node --test tests/pages-static.test.cjs
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
